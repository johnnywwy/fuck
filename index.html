<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Fibonacci.Trader - 周期全量统计 + 江恩螺旋</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="analysis.js"></script>
</head>
<body>
  <div id="container">
    <div class="toolbar">
      <div class="group" id="scaleGroup">
        <button class="btn active" data-type="value">线性轴</button>
        <button class="btn" data-type="log">对数轴</button>
      </div>
      <div class="group" id="yearPicker" style="background: #e6f7ff; border: 1px solid #91d5ff;"></div>
    </div>

    <div id="main"></div>

    <div class="analysis-grid">
      <div class="box">
        <table>
          <thead>
            <tr>
              <th>方向</th>
              <th>日期区间</th>
              <th>间隔(d)</th>
              <th>价格轨迹</th>
              <th>幅度</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="fib-panel">
        <div class="fib-header">
          <span style="font-weight: bold; color: #856404">⏳ 规律匹配 (按日期由小到大)</span>
          <div>符合率: <span class="prob-val" id="fibProb">0%</span></div>
        </div>
        <div id="fibList" class="fib-list">
          <div style="color: #999; text-align: center; margin-top: 20px">正在扫描斐波那契序列...</div>
        </div>
      </div>
    </div>

    <div class="fft-panel">
      <div style="font-weight: bold; color: #003a8c">
        📡 傅里叶变换：共振周期提取 (主导变盘天数频率)
      </div>
      <div id="fftResult" class="fft-flex"></div>
    </div>

    <div class="gann-section">
      <div class="gann-ctrl">
        <span>🌀 江恩 28x28 螺旋 (起始日期: 2023/01/01)</span>
        <input type="range" id="gannSizeSlider" min="15" max="60" value="32" />
        <span id="gLabel">32px</span>

        <label class="holiday-toggle">
          <input type="checkbox" id="gannHolidayToggle">
          👻 屏蔽美股休市 (透明化)
        </label>
      </div>
      <div class="gann-wrap" id="gannWrap">
        <div id="gannDisplay"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
